<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0F" />
      <stop offset="100%" stop-color="#0F131D" />
    </linearGradient>
    <linearGradient id="blueLeg" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="purpleLeg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="60%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>
    <linearGradient id="orbitRing" x1="0%" y1="40%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="80%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E879F9" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#242B38" stroke-width="1.5" opacity="0.6" />

  <!-- Sparkle Star (top right) -->
  <path d="M 88 18 Q 88 26 80 26 Q 88 26 88 34 Q 88 26 96 26 Q 88 26 88 18 Z" fill="url(#sparkleGrad)" filter="url(#softGlow)" />

  <!-- The 3D Letter A -->
  <g transform="translate(14, 18)">
    <!-- Right leg (purple gradient) -->
    <path d="M 50 14 L 72 74 C 72.8 76 71.5 78 68.5 78 L 56 78 C 53.5 78 51.5 76.5 50.5 74 L 43 54 L 33 28 Z" fill="url(#purpleLeg)" />
    
    <!-- Left leg (cyan-to-blue gradient) -->
    <path d="M 50 14 L 28 74 C 27.2 76 25 78 22 78 L 10 78 C 7 78 6 76 7 73.5 L 34 14 C 36 9 44 9 50 14 Z" fill="url(#blueLeg)" />

    <!-- Luminous Dynamic 3D Orbit Swoop -->
    <path d="M 12 56 C 24 45 48 38 72 48 C 76 49.7 75 54 70 55 C 48 58 26 66 12 62 C 9 61 9 57.5 12 56 Z" fill="url(#orbitRing)" filter="url(#softGlow)" opacity="0.95" />
  </g>
</svg>
